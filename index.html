
<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Anime Explorer</title>

<style>
:root{
    --bg:#0b0912;
    --surface:#151120;
    --surface2:#1d172b;
    --surface3:#282039;
    --primary:#a855f7;
    --primary-light:#c084fc;
    --primary-dark:#7e22ce;
    --text:#f5f0ff;
    --muted:#a69bb8;
    --border:rgba(168,85,247,.25);
    --glow:rgba(168,85,247,.18);
}

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Inter,Arial,sans-serif;
    background:
        radial-gradient(ellipse at 50% -20%,rgba(126,34,206,.22),transparent 55%),
        var(--bg);
    color:var(--text);
    min-height:100vh;
    padding:25px 5%;
}

/* BARRE DU HAUT */

.top-bar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:15px 20px;
    background:rgba(21,17,32,.8);
    border:1px solid var(--border);
    border-radius:16px;
    backdrop-filter:blur(12px);
    box-shadow:0 8px 30px rgba(0,0,0,.2);
}

.logo{
    color:var(--primary-light);
    font-size:23px;
    font-weight:900;
    letter-spacing:.5px;
}

.logo span{
    color:white;
}

.language-select{
    background:var(--surface2);
    color:white;
    border:1px solid var(--border);
    padding:11px 14px;
    border-radius:10px;
    cursor:pointer;
    outline:none;
}

/* TITRE */

h1{
    text-align:center;
    font-size:clamp(34px,5vw,55px);
    font-weight:900;
    margin:55px 0 12px;
    letter-spacing:-1.5px;
    background:linear-gradient(90deg,#9333ea,#d8b4fe,#9333ea);
    background-clip:text;
    -webkit-background-clip:text;
    color:transparent;
}

.subtitle{
    text-align:center;
    color:var(--muted);
    font-size:15px;
    margin-bottom:35px;
}

/* RECHERCHE */

.search{
    display:flex;
    justify-content:center;
    gap:12px;
    max-width:600px;
    margin:0 auto 35px;
}

.search input{
    flex:1;
    min-width:0;
    padding:15px 19px;
    background:var(--surface);
    color:white;
    border:1px solid var(--border);
    border-radius:12px;
    outline:none;
    font-size:15px;
    transition:.25s;
}

.search input:focus{
    border-color:var(--primary);
    box-shadow:0 0 0 4px var(--glow);
}

button{
    padding:13px 20px;
    background:linear-gradient(135deg,var(--primary),var(--primary-dark));
    color:white;
    border:none;
    border-radius:11px;
    cursor:pointer;
    font-weight:bold;
    transition:.25s;
}

button:hover{
    transform:translateY(-2px);
    box-shadow:0 7px 22px var(--glow);
    filter:brightness(1.15);
}

/* ACCUEIL */

.home-sections{
    display:flex;
    flex-direction:column;
    gap:42px;
    margin-top:35px;
}

.anime-section{
    width:100%;
}

.section-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:17px;
    padding-bottom:12px;
    border-bottom:1px solid var(--border);
}

.section-header h2{
    color:var(--primary-light);
    font-size:21px;
    font-weight:800;
}

.arrows{
    display:flex;
    gap:9px;
}

.arrow{
    background:var(--surface2);
    color:var(--primary-light);
    border:1px solid var(--border);
    font-size:23px;
    padding:5px 14px;
    border-radius:9px;
}

.arrow:hover{
    background:var(--primary);
    color:white;
}

.anime-row{
    display:flex;
    gap:18px;
    overflow-x:auto;
    scroll-behavior:smooth;
    padding:5px 5px 18px;
}

.anime-row::-webkit-scrollbar{
    height:6px;
}

.anime-row::-webkit-scrollbar-track{
    background:var(--surface);
    border-radius:10px;
}

.anime-row::-webkit-scrollbar-thumb{
    background:var(--primary-dark);
    border-radius:10px;
}

/* CARTES */

.anime-item,
.card{
    background:linear-gradient(145deg,#1c1728,#14111d);
    border:1px solid var(--border);
    border-radius:15px;
    cursor:pointer;
    transition:transform .25s,border-color .25s,box-shadow .25s;
    overflow:hidden;
}

.anime-item{
    flex:0 0 180px;
    padding:11px;
}

.anime-item:hover,
.card:hover{
    transform:translateY(-7px);
    border-color:var(--primary);
    box-shadow:0 12px 30px rgba(126,34,206,.2);
}

.anime-item img{
    width:100%;
    height:235px;
    object-fit:cover;
    border-radius:10px;
}

.anime-item h3{
    font-size:14px;
    color:var(--primary-light);
    min-height:35px;
    margin-top:12px;
    line-height:1.4;
}

.anime-item p{
    font-size:12px;
    color:var(--muted);
    margin:7px 0;
}

.total-card{
    color:var(--primary-light)!important;
    font-weight:bold;
}

.total-seasons,
.total-movies{
    color:var(--muted)!important;
}

.section-loading{
    color:var(--muted);
    padding:15px;
}

/* RÉSULTATS */

#animes{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(205px,1fr));
    gap:22px;
}

.card{
    padding:13px;
}

.card img{
    width:100%;
    height:290px;
    object-fit:cover;
    border-radius:10px;
}

.card h2{
    font-size:17px;
    color:var(--primary-light);
    margin:13px 0;
    line-height:1.4;
}

.card p{
    font-size:13px;
    line-height:1.6;
    color:var(--muted);
}

#message{
    text-align:center;
    margin:22px;
    color:var(--primary-light);
}

/* MODALE */

.modal{
    display:none;
    position:fixed;
    z-index:10;
    inset:0;
    background:rgba(5,3,10,.88);
    backdrop-filter:blur(9px);
    overflow-y:auto;
    padding:25px;
}

.modal-content{
    background:linear-gradient(145deg,#1b1628,#100d18);
    border:1px solid var(--border);
    max-width:950px;
    margin:30px auto;
    padding:30px;
    border-radius:20px;
    position:relative;
    box-shadow:0 20px 80px rgba(0,0,0,.5);
}

.close{
    position:absolute;
    top:15px;
    right:15px;
    color:white;
    background:var(--surface3);
    border:1px solid var(--border);
    font-size:19px;
    padding:8px 13px;
    border-radius:9px;
}

/* PROFIL */

.profile-header{
    display:flex;
    gap:25px;
    margin-top:20px;
}

.profile-header img{
    width:205px;
    height:300px;
    object-fit:cover;
    border-radius:13px;
    border:1px solid var(--border);
    flex-shrink:0;
    box-shadow:0 10px 30px rgba(0,0,0,.3);
}

.profile-info{
    flex:1;
    min-width:0;
}

.profile-info h2{
    color:var(--primary-light);
    font-size:27px;
    margin:5px 0 18px;
}

.profile-info p{
    line-height:1.7;
    color:#c7bdd5;
    font-size:14px;
    margin-top:10px;
}

/* STATISTIQUES */

.franchise-stats{
    display:flex;
    flex-wrap:wrap;
    gap:12px;
    margin:20px 0;
}

.stat-box{
    background:linear-gradient(145deg,#291c3c,#1b1528);
    border:1px solid var(--border);
    border-radius:12px;
    padding:15px 18px;
    min-width:145px;
    flex:1;
    transition:.2s;
}

.stat-box:hover{
    border-color:var(--primary);
    transform:translateY(-3px);
}

.stat-label{
    display:block;
    color:var(--muted);
    font-size:12px;
    margin-bottom:8px;
}

.stat-value{
    color:var(--primary-light);
    font-size:25px;
    font-weight:900;
}

/* SÉLECTEUR */

.season-selector{
    margin-top:35px;
    padding-top:25px;
    border-top:1px solid var(--border);
    display:flex;
    flex-direction:column;
    gap:13px;
}

.season-selector label{
    color:var(--primary-light);
    font-size:19px;
    font-weight:800;
}

#seasonSelect{
    width:100%;
    max-width:500px;
    padding:15px;
    background:var(--surface2);
    color:white;
    border:1px solid var(--border);
    border-radius:11px;
    font-size:15px;
    cursor:pointer;
    outline:none;
}

#seasonSelect:focus{
    border-color:var(--primary);
    box-shadow:0 0 0 3px var(--glow);
}

#seasonSelect option{
    background:var(--surface2);
    color:white;
}

.season-loading{
    color:var(--muted);
    font-size:13px;
}

/* RESPONSIVE */

@media(max-width:650px){
    body{
        padding:15px;
    }

    .top-bar{
        padding:12px;
    }

    .logo{
        font-size:19px;
    }

    h1{
        margin-top:40px;
    }

    .search{
        gap:7px;
    }

    .search input{
        padding:13px;
    }

    .search button{
        padding:12px;
    }

    .anime-item{
        flex-basis:150px;
    }

    .anime-item img{
        height:200px;
    }

    .profile-header{
        flex-direction:column;
    }

    .profile-header img{
        width:150px;
        height:215px;
    }

    .modal{
        padding:10px;
    }

    .modal-content{
        padding:20px;
        margin:15px auto;
    }

    .stat-box{
        min-width:110px;
    }

    #animes{
        grid-template-columns:repeat(2,minmax(0,1fr));
        gap:12px;
    }

    .card{
        padding:9px;
    }

    .card img{
        height:210px;
    }
}

@media(max-width:380px){
    .language-select{
        padding:8px;
        font-size:12px;
    }

    .card img{
        height:175px;
    }
}
</style>
</head>

<body>

<div class="top-bar">
    <div class="logo">Anime <span>Explorer</span></div>

    <select id="languageSelect" class="language-select">
        <option value="fr">🇫🇷 Français</option>
        <option value="en">🇬🇧 English</option>
        <option value="de">🇩🇪 Deutsch</option>
    </select>
</div>

<h1>Anime Explorer</h1>
<p class="subtitle">Explore tes animes préférés et découvre leurs univers.</p>

<form class="search" id="searchForm">
    <input type="text" id="searchInput" placeholder="Rechercher un anime...">
    <button type="submit" id="searchButton">Rechercher</button>
</form>

<p id="message"></p>

<div id="homeSections" class="home-sections"></div>
<div id="animes"></div>

<div class="modal" id="animeModal">
    <div class="modal-content">
        <button class="close" id="closeModal">✕</button>

        <div id="profileContent"></div>

        <div class="season-selector">
            <label for="seasonSelect" id="seasonHeading">
                Choisir une saison ou un film
            </label>

            <select id="seasonSelect">
                <option value="">Chargement...</option>
            </select>

            <p id="seasonMessage" class="season-loading"></p>
        </div>
    </div>
</div>

<script>
const API = "https://kitsu.io/api/edge/anime";

/* TRADUCTIONS */

const translations = {
    fr:{
        search:"Rechercher",placeholder:"Rechercher un anime...",
        loading:"Chargement...",calculating:"Calcul du total...",
        found:"animes trouvés",noAnime:"Aucun anime trouvé.",
        error:"Impossible de charger les animes.",
        totalEpisodes:"Épisodes au total",totalSeasons:"Saisons TV",
        totalMovies:"Films officiels",score:"Note",date:"Date de sortie",
        genres:"Genres",noScore:"Non noté",unknown:"Inconnu",
        noGenres:"Non renseigné",synopsis:"Aucun résumé disponible.",
        seasonChoice:"Choisir une saison ou un film",
        noSeasons:"Aucune saison ou aucun film officiel référencé.",
        tv:"Saison TV",movie:"Film",
        followed:"🔥 Les plus suivis",
        favorites:"❤️ Les plus ajoutés aux favoris",
        longest:"⏳ Les animes les plus longs",
        topRated:"🏆 Les mieux notés de tous les temps",
        current:"📈 Les plus populaires actuellement",
        related:"contenus liés",
        loadingProfile:"Chargement du profil...",
        loadingSeasons:"Recherche des saisons et des films...",
        seasonError:"Impossible de récupérer les saisons."
    },
    en:{
        search:"Search",placeholder:"Search for an anime...",
        loading:"Loading...",calculating:"Calculating total...",
        found:"anime found",noAnime:"No anime found.",
        error:"Unable to load anime.",
        totalEpisodes:"Total episodes",totalSeasons:"TV seasons",
        totalMovies:"Official movies",score:"Rating",
        date:"Release date",genres:"Genres",
        noScore:"Not rated",unknown:"Unknown",
        noGenres:"Not available",synopsis:"No synopsis available.",
        seasonChoice:"Choose a season or movie",
        noSeasons:"No official seasons or movies referenced.",
        tv:"TV season",movie:"Movie",
        followed:"🔥 Most followed",favorites:"❤️ Most favorited",
        longest:"⏳ Longest anime",
        topRated:"🏆 Highest rated of all time",
        current:"📈 Currently popular",
        related:"related entries",
        loadingProfile:"Loading profile...",
        loadingSeasons:"Searching for seasons and movies...",
        seasonError:"Unable to retrieve seasons."
    },
    de:{
        search:"Suchen",placeholder:"Anime suchen...",
        loading:"Laden...",calculating:"Gesamtsumme wird berechnet...",
        found:"Animes gefunden",noAnime:"Keine Animes gefunden.",
        error:"Animes konnten nicht geladen werden.",
        totalEpisodes:"Episoden insgesamt",totalSeasons:"TV-Staffeln",
        totalMovies:"Offizielle Filme",score:"Bewertung",
        date:"Erscheinungsdatum",genres:"Genres",
        noScore:"Nicht bewertet",unknown:"Unbekannt",
        noGenres:"Nicht verfügbar",synopsis:"Keine Zusammenfassung verfügbar.",
        seasonChoice:"Staffel oder Film auswählen",
        noSeasons:"Keine offiziellen Staffeln oder Filme gefunden.",
        tv:"TV-Staffel",movie:"Film",
        followed:"🔥 Am meisten verfolgt",
        favorites:"❤️ Am häufigsten favorisiert",
        longest:"⏳ Die längsten Animes",
        topRated:"🏆 Am besten bewertet aller Zeiten",
        current:"📈 Aktuell beliebt",
        related:"verwandte Einträge",
        loadingProfile:"Profil wird geladen...",
        loadingSeasons:"Staffeln und Filme werden gesucht...",
        seasonError:"Staffeln konnten nicht geladen werden."
    }
};

let currentLanguage = "fr";
let lastSearch = "";
let currentRequest = 0;
let profileRequest = 0;

const categoryCache = new Map();
const animeResponseCache = new Map();
const franchiseStatsCache = new Map();
const franchiseStatsPending = new Map();

function getText(){
    return translations[currentLanguage];
}

function getTitle(anime){
    const a = anime.attributes || {};

    return a.titles?.[currentLanguage] ||
        a.titles?.en ||
        a.canonicalTitle ||
        a.titles?.en_jp ||
        getText().unknown;
}

function getDate(anime){
    const date = anime.attributes?.startDate;
    if(!date) return getText().unknown;

    const locales = {fr:"fr-FR",en:"en-GB",de:"de-DE"};

    return new Date(date).toLocaleDateString(locales[currentLanguage]);
}

function formatNumber(number){
    const locales = {fr:"fr-FR",en:"en-GB",de:"de-DE"};

    return Number(number).toLocaleString(locales[currentLanguage]);
}

const categories = [
    {id:"followed",sort:"-userCount"},
    {id:"favorites",sort:"-favoritesCount"},
    {id:"longest",sort:"-episodeCount"},
    {id:"topRated",sort:"-averageRating"},
    {id:"current",sort:"-userCount",status:"current"}
];

/* RELATIONS */

function normalizeRole(role){
    return String(role || "")
        .toLowerCase()
        .replace(/[^a-z]/g,"");
}

function getRelatedIds(anime,included=[]){
    const ids = new Set();
    const relationRefs = anime.relationships?.mediaRelationships?.data || [];
    const relationMap = new Map();
    const animeMap = new Map();

    included.forEach(item=>{
        if(item.type==="mediaRelationships"){
            relationMap.set(String(item.id),item);
        }

        if(item.type==="anime"){
            animeMap.set(String(item.id),item);
        }
    });

    relationRefs.forEach(ref=>{
        const relation = relationMap.get(String(ref.id));
        if(!relation) return;

        const role = normalizeRole(relation.attributes?.role);
        const source = relation.relationships?.source?.data;
        const destination = relation.relationships?.destination?.data;

        let target = null;

        if(source?.type==="anime" && String(source.id)!==String(anime.id)){
            target = source;
        }

        if(destination?.type==="anime" && String(destination.id)!==String(anime.id)){
            target = destination;
        }

        if(!target) return;

        const targetAnime = animeMap.get(String(target.id));
        const subtype = String(targetAnime?.attributes?.subtype || "").toLowerCase();

        const isPrequelOrSequel = role==="prequel" || role==="sequel";
        const isRelatedMovie = role==="sidestory" && subtype==="movie";

        if(isPrequelOrSequel || isRelatedMovie){
            ids.add(String(target.id));
        }
    });

    return ids;
}

/* REGROUPEMENT */

function groupAnimes(animeList,included=[]){
    const animeMap = new Map();

    animeList.forEach(anime=>animeMap.set(String(anime.id),anime));

    const parent = new Map();

    function find(id){
        if(!parent.has(id)) parent.set(id,id);
        if(parent.get(id)!==id) parent.set(id,find(parent.get(id)));
        return parent.get(id);
    }

    function unite(id1,id2){
        const root1 = find(id1);
        const root2 = find(id2);
        if(root1!==root2) parent.set(root2,root1);
    }

    animeList.forEach(anime=>{
        const relatedIds = getRelatedIds(anime,included);

        relatedIds.forEach(id=>{
            if(animeMap.has(id)) unite(String(anime.id),id);
        });
    });

    const groups = new Map();

    animeList.forEach(anime=>{
        const root = find(String(anime.id));
        if(!groups.has(root)) groups.set(root,[]);
        groups.get(root).push(anime);
    });

    return Array.from(groups.values()).map(items=>{
        items.sort((a,b)=>{
            const dateA = a.attributes?.startDate || "9999";
            const dateB = b.attributes?.startDate || "9999";
            return dateA.localeCompare(dateB);
        });

        return {main:items[0],items:items};
    });
}

/* RÉCUPÉRATION DES RELATIONS */

async function fetchAnimeRelations(id){
    const key = String(id);

    if(animeResponseCache.has(key)){
        return animeResponseCache.get(key);
    }

    const request = (async()=>{
        const params = new URLSearchParams({
            include:"mediaRelationships,mediaRelationships.destination,mediaRelationships.source"
        });

        const response = await fetch(API+"/"+key+"?"+params.toString());

        if(!response.ok) throw new Error("Anime introuvable : "+key);

        return await response.json();
    })();

    animeResponseCache.set(key,request);

    try{
        return await request;
    }catch(error){
        animeResponseCache.delete(key);
        throw error;
    }
}

/* RÉCUPÉRATION DE LA FRANCHISE */

async function getFranchiseAnime(startAnime,requestId=null){
    const found = new Map();
    const visited = new Set();
    let queue = [String(startAnime.id)];

    found.set(String(startAnime.id),startAnime);

    const batchSize = 4;

    while(queue.length>0){
        if(requestId!==null && requestId!==profileRequest) return [];

        const batch = queue.filter(id=>!visited.has(id)).slice(0,batchSize);
        queue = queue.filter(id=>!batch.includes(id));

        if(batch.length===0) break;

        batch.forEach(id=>visited.add(id));

        const results = await Promise.allSettled(
            batch.map(id=>fetchAnimeRelations(id))
        );

        if(requestId!==null && requestId!==profileRequest) return [];

        results.forEach(result=>{
            if(result.status!=="fulfilled") return;

            const data = result.value;
            if(!data.data) return;

            const anime = data.data;
            found.set(String(anime.id),anime);

            const included = data.included || [];
            const relatedIds = getRelatedIds(anime,included);

            relatedIds.forEach(id=>{
                if(!visited.has(id) && !queue.includes(id)) queue.push(id);
            });

            included.forEach(item=>{
                if(item.type==="anime" && relatedIds.has(String(item.id))){
                    found.set(String(item.id),item);
                }
            });
        });
    }

    return Array.from(found.values()).sort((a,b)=>{
        const dateA = a.attributes?.startDate || "9999";
        const dateB = b.attributes?.startDate || "9999";
        return dateA.localeCompare(dateB);
    });
}

/* FILTRAGE DES SAISONS ET FILMS */

function getTvSeasons(franchise){
    return franchise.filter(anime=>
        String(anime.attributes?.subtype || "").toLowerCase()==="tv"
    );
}

function getOfficialMovies(franchise){
    return franchise.filter(anime=>
        String(anime.attributes?.subtype || "").toLowerCase()==="movie"
    );
}

function getOfficialEntries(franchise){
    return franchise.filter(anime=>{
        const subtype = String(anime.attributes?.subtype || "").toLowerCase();
        return subtype==="tv" || subtype==="movie";
    });
}

/* STATISTIQUES */

async function getFranchiseStats(anime){
    const id = String(anime.id);

    if(franchiseStatsCache.has(id)) return franchiseStatsCache.get(id);
    if(franchiseStatsPending.has(id)) return franchiseStatsPending.get(id);

    const promise = (async()=>{
        const franchise = await getFranchiseAnime(anime);
        const tvSeasons = getTvSeasons(franchise);
        const movies = getOfficialMovies(franchise);

        const totalEpisodes = tvSeasons.reduce((total,item)=>{
            const count = Number(item.attributes?.episodeCount);
            return total+(Number.isFinite(count)&&count>0?count:0);
        },0);

        const stats = {
            totalEpisodes,
            totalSeasons:tvSeasons.length,
            totalMovies:movies.length,
            franchise
        };

        franchise.forEach(item=>{
            franchiseStatsCache.set(String(item.id),stats);
        });

        return stats;
    })();

    franchiseStatsPending.set(id,promise);

    try{
        return await promise;
    }finally{
        franchiseStatsPending.delete(id);
    }
}

/* MISE À JOUR DES CARTES */

async function updateCardTotal(card,anime,episodeElement){
    try{
        const stats = await getFranchiseStats(anime);
        if(!card.isConnected) return;

        episodeElement.textContent =
            getText().totalEpisodes+" : "+formatNumber(stats.totalEpisodes);

        const seasonsElement = card.querySelector(".total-seasons");
        const moviesElement = card.querySelector(".total-movies");

        if(seasonsElement){
            seasonsElement.textContent =
                getText().totalSeasons+" : "+stats.totalSeasons;
        }

        if(moviesElement){
            moviesElement.textContent =
                getText().totalMovies+" : "+stats.totalMovies;
        }
    }catch(error){
        console.error("Erreur calcul total :",error);

        if(card.isConnected){
            episodeElement.textContent =
                getText().totalEpisodes+" : "+getText().unknown;
        }
    }
}

/* OBSERVATEUR */

const cardObserver = "IntersectionObserver" in window
    ? new IntersectionObserver(entries=>{
        entries.forEach(entry=>{
            if(!entry.isIntersecting) return;

            const card = entry.target;
            cardObserver.unobserve(card);
            updateCardTotal(card,card._anime,card._episodeElement);
        });
    },{rootMargin:"400px"})
    : null;

function observeAnimeCard(card,anime,episodeElement){
    card._anime = anime;
    card._episodeElement = episodeElement;

    if(cardObserver) cardObserver.observe(card);
    else updateCardTotal(card,anime,episodeElement);
}

/* CARTES */

function createAnimeCard(anime,className="anime-item"){
    const a = anime.attributes || {};
    const card = document.createElement("div");
    card.className = className;

    const img = document.createElement("img");
    img.src = a.posterImage?.medium || a.posterImage?.small || "";
    img.alt = getTitle(anime);
    img.loading = "lazy";
    img.onerror = ()=>img.style.display="none";

    const title = document.createElement("h3");
    title.textContent = getTitle(anime);

    const episodes = document.createElement("p");
    episodes.className = "total-card";
    episodes.textContent = getText().totalEpisodes+" : "+getText().calculating;

    const seasons = document.createElement("p");
    seasons.className = "total-seasons";

    const movies = document.createElement("p");
    movies.className = "total-movies";

    card.append(img,title,episodes,seasons,movies);
    observeAnimeCard(card,anime,episodes);

    card.addEventListener("click",()=>openProfile(anime));

    return card;
}

/* CATÉGORIES */

async function loadCategory(category,force=false){
    if(!force && categoryCache.has(category.id)) return categoryCache.get(category.id);

    const params = new URLSearchParams({
        sort:category.sort,
        "page[limit]":"20",
        include:"mediaRelationships,mediaRelationships.destination,mediaRelationships.source"
    });

    if(category.status) params.set("filter[status]",category.status);

    const response = await fetch(API+"?"+params.toString());
    if(!response.ok) throw new Error("API_ERROR");

    const data = await response.json();
    const groups = groupAnimes(data.data||[],data.included||[]);
    const results = groups.slice(0,16);

    categoryCache.set(category.id,results);
    return results;
}

/* ACCUEIL */

async function loadHomeSections(force=false){
    const requestId = ++currentRequest;

    const home = document.getElementById("homeSections");
    const results = document.getElementById("animes");
    const message = document.getElementById("message");

    home.style.display = "flex";
    results.style.display = "none";
    message.textContent = "";
    home.innerHTML = "";

    for(let i=0;i<categories.length;i++){
        if(requestId!==currentRequest) return;

        const category = categories[i];
        const section = document.createElement("section");
        section.className = "anime-section";

        const header = document.createElement("div");
        header.className = "section-header";

        const heading = document.createElement("h2");
        heading.textContent = getText()[category.id];

        const arrows = document.createElement("div");
        arrows.className = "arrows";

        const row = document.createElement("div");
        row.className = "anime-row";

        const left = document.createElement("button");
        left.className = "arrow";
        left.textContent = "‹";

        const right = document.createElement("button");
        right.className = "arrow";
        right.textContent = "›";

        left.addEventListener("click",()=>row.scrollBy({left:-600,behavior:"smooth"}));
        right.addEventListener("click",()=>row.scrollBy({left:600,behavior:"smooth"}));

        arrows.append(left,right);
        header.append(heading,arrows);

        const loading = document.createElement("p");
        loading.className = "section-loading";
        loading.textContent = getText().loading;

        row.appendChild(loading);
        section.append(header,row);
        home.appendChild(section);

        try{
            const groups = await loadCategory(category,force);
            if(requestId!==currentRequest) return;

            row.innerHTML = "";

            if(groups.length===0) row.textContent = getText().noAnime;

            groups.forEach(group=>{
                const card = createAnimeCard(group.main);

                const count = document.createElement("p");
                count.textContent = group.items.length+" "+getText().related;
                count.style.color = "var(--primary-light)";

                card.appendChild(count);
                row.appendChild(card);
            });
        }catch(error){
            console.error(category.id,error);
            if(requestId!==currentRequest) return;
            row.textContent = getText().error;
        }

        if(i<categories.length-1){
            await new Promise(resolve=>setTimeout(resolve,300));
        }
    }
}

/* RECHERCHE */

async function getAnimes(search=""){
    lastSearch = search;
    const requestId = ++currentRequest;

    const container = document.getElementById("animes");
    const home = document.getElementById("homeSections");
    const message = document.getElementById("message");

    home.style.display = "none";
    container.style.display = "grid";
    container.innerHTML = "";
    message.textContent = getText().loading;

    try{
        const params = new URLSearchParams({
            "filter[text]":search,
            "page[limit]":"20",
            include:"genres,mediaRelationships,mediaRelationships.destination,mediaRelationships.source"
        });

        const response = await fetch(API+"?"+params.toString());
        if(!response.ok) throw new Error("API_ERROR");

        const data = await response.json();
        if(requestId!==currentRequest) return;

        const groups = groupAnimes(data.data||[],data.included||[]);

        if(groups.length===0){
            message.textContent = getText().noAnime;
            return;
        }

        message.textContent = groups.length+" "+getText().found;

        groups.slice(0,16).forEach(group=>{
            const anime = group.main;
            const card = document.createElement("div");
            card.className = "card";

            const img = document.createElement("img");
            img.src = anime.attributes?.posterImage?.medium || anime.attributes?.posterImage?.small || "";
            img.alt = getTitle(anime);
            img.loading = "lazy";
            img.onerror = ()=>img.style.display="none";

            const title = document.createElement("h2");
            title.textContent = getTitle(anime);

            const episodes = document.createElement("p");
            episodes.className = "total-card";
            episodes.textContent = getText().totalEpisodes+" : "+getText().calculating;

            const seasons = document.createElement("p");
            seasons.className = "total-seasons";

            const movies = document.createElement("p");
            movies.className = "total-movies";

            const date = document.createElement("p");
            date.textContent = getText().date+" : "+getDate(anime);

            card.append(img,title,episodes,seasons,movies,date);
            observeAnimeCard(card,anime,episodes);

            card.addEventListener("click",()=>openProfile(anime));
            container.appendChild(card);
        });
    }catch(error){
        if(requestId!==currentRequest) return;
        message.textContent = getText().error;
        console.error(error);
    }
}

/* STATISTIQUES */

function createStatBox(label,value){
    const box = document.createElement("div");
    box.className = "stat-box";

    const statLabel = document.createElement("span");
    statLabel.className = "stat-label";
    statLabel.textContent = label;

    const statValue = document.createElement("span");
    statValue.className = "stat-value";
    statValue.textContent = formatNumber(value);

    box.append(statLabel,statValue);
    return box;
}

/* PROFIL */

function renderSeasonProfile(anime,franchise){
    const profile = document.getElementById("profileContent");
    const a = anime.attributes || {};

    const tvSeasons = getTvSeasons(franchise);
    const movies = getOfficialMovies(franchise);

    const totalEpisodes = tvSeasons.reduce((total,item)=>{
        const count = Number(item.attributes?.episodeCount);
        return total+(Number.isFinite(count)&&count>0?count:0);
    },0);

    profile.innerHTML = "";

    const header = document.createElement("div");
    header.className = "profile-header";

    const img = document.createElement("img");
    img.src = a.posterImage?.large || a.posterImage?.medium || "";
    img.alt = getTitle(anime);
    img.onerror = ()=>img.style.display="none";

    const info = document.createElement("div");
    info.className = "profile-info";

    const title = document.createElement("h2");
    title.textContent = getTitle(anime);

    const stats = document.createElement("div");
    stats.className = "franchise-stats";

    stats.append(
        createStatBox(getText().totalEpisodes,totalEpisodes),
        createStatBox(getText().totalSeasons,tvSeasons.length),
        createStatBox(getText().totalMovies,movies.length)
    );

    const score = document.createElement("p");
    score.textContent = getText().score+" : "+(a.averageRating ?? getText().noScore);

    const date = document.createElement("p");
    date.textContent = getText().date+" : "+getDate(anime);

    const genre = document.createElement("p");
    genre.textContent = getText().genres+" : "+(anime.genres || getText().noGenres);

    const description = document.createElement("p");
    description.textContent = a.synopsis || getText().synopsis;

    info.append(title,stats,score,date,genre,description);
    header.append(img,info);
    profile.appendChild(header);
}

/* GENRES */

async function loadSeasonGenres(anime,requestId){
    try{
        const response = await fetch(API+"/"+anime.id+"?include=genres");
        if(!response.ok) return;

        const data = await response.json();
        if(requestId!==profileRequest) return;

        anime.genres = (data.included||[])
            .filter(item=>item.type==="genres")
            .map(item=>item.attributes?.name)
            .filter(Boolean)
            .join(", ");
    }catch(error){
        console.error("Erreur genres :",error);
    }
}

/* PROFIL ET SAISONS */

async function openProfile(anime){
    const requestId = ++profileRequest;

    const modal = document.getElementById("animeModal");
    const profile = document.getElementById("profileContent");
    const selector = document.getElementById("seasonSelect");
    const heading = document.getElementById("seasonHeading");
    const seasonMessage = document.getElementById("seasonMessage");

    modal.style.display = "block";
    profile.textContent = getText().loadingProfile;

    selector.innerHTML = "";
    selector.disabled = true;
    heading.textContent = getText().seasonChoice;
    seasonMessage.textContent = getText().loadingSeasons;

    try{
        const franchise = await getFranchiseAnime(anime,requestId);
        if(requestId!==profileRequest) return;

        const officialEntries = getOfficialEntries(franchise);
        selector.innerHTML = "";

        officialEntries.forEach(entry=>{
            const option = document.createElement("option");
            option.value = String(entry.id);

            const year = entry.attributes?.startDate?.substring(0,4) || getText().unknown;
            const subtype = String(entry.attributes?.subtype||"").toLowerCase();
            const typeLabel = subtype==="movie" ? getText().movie : getText().tv;

            option.textContent = getTitle(entry)+" ("+year+") - "+typeLabel;
            selector.appendChild(option);
        });

        selector.disabled = false;

        const tvSeasons = getTvSeasons(franchise);
        const movies = getOfficialMovies(franchise);

        seasonMessage.textContent =
            tvSeasons.length+" "+getText().totalSeasons.toLowerCase()+
            " • "+movies.length+" "+getText().totalMovies.toLowerCase();

        const initialSeason =
            officialEntries.find(item=>String(item.id)===String(anime.id)) ||
            tvSeasons[0] ||
            officialEntries[0];

        if(!initialSeason){
            profile.textContent = getText().noSeasons;
            selector.disabled = true;
            return;
        }

        selector.value = String(initialSeason.id);

        async function displaySeason(season){
            if(requestId!==profileRequest) return;

            profile.textContent = getText().loadingProfile;
            await loadSeasonGenres(season,requestId);

            if(requestId!==profileRequest) return;
            renderSeasonProfile(season,franchise);
        }

        await displaySeason(initialSeason);

        selector.onchange = async()=>{
            const selectedSeason = officialEntries.find(item=>String(item.id)===selector.value);
            if(selectedSeason) await displaySeason(selectedSeason);
        };
    }catch(error){
        if(requestId!==profileRequest) return;

        profile.textContent = getText().error;
        seasonMessage.textContent = getText().seasonError;
        console.error("Erreur profil :",error);
    }
}

/* FERMER LE PROFIL */

function closeProfile(){
    profileRequest++;
    document.getElementById("animeModal").style.display = "none";
}

document.getElementById("closeModal").addEventListener("click",closeProfile);

document.getElementById("animeModal").addEventListener("click",event=>{
    if(event.target.id==="animeModal") closeProfile();
});

/* RECHERCHE */

document.getElementById("searchForm").addEventListener("submit",event=>{
    event.preventDefault();

    const search = document.getElementById("searchInput").value.trim();

    if(search===""){
        lastSearch = "";
        loadHomeSections();
    }else{
        getAnimes(search);
    }
});

/* LANGUE */

document.getElementById("languageSelect").addEventListener("change",async()=>{
    currentLanguage = document.getElementById("languageSelect").value;
    document.documentElement.lang = currentLanguage;

    document.getElementById("searchButton").textContent = getText().search;
    document.getElementById("searchInput").placeholder = getText().placeholder;

    if(document.getElementById("animeModal").style.display==="block"){
        closeProfile();
    }

    if(lastSearch===""){
        await loadHomeSections();
    }else{
        await getAnimes(lastSearch);
    }
});

/* DÉMARRAGE */

loadHomeSections();
